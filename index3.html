<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz App | SkillCraft Task</title>
    <link rel="stylesheet" href="index3.css">
</head>
<body>
    <div class="app-container">
        <!-- Authentication Section -->
        <div id="auth-screen" class="card">
            <h2 id="auth-title">Login to Take Quiz</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <p id="auth-error" class="error-msg"></p>
                <button type="submit" id="auth-btn">Login</button>
            </form>
            <p class="toggle-text">
                <span id="toggle-msg">Don't have an account?</span> 
                <a href="#" id="toggle-auth">Sign Up</a>
            </p>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-screen" class="card hidden">
            <div class="quiz-header">
                <span id="user-display"></span>
                <button id="logout-btn" class="btn-secondary">Logout</button>
            </div>
            
            <div id="question-container">
                <div class="progress-bar">
                    <div id="progress" class="progress-fill"></div>
                </div>
                <h3 id="question-text">Question goes here</h3>
                <div id="options-container" class="options-grid"></div>
                <p id="feedback-msg" class="feedback"></p>
            </div>

            <div class="quiz-footer">
                <span id="question-count">Question 1 of 5</span>
                <button id="next-btn" class="hidden">Next Question</button>
            </div>
        </div>

        <!-- Result Section -->
        <div id="result-screen" class="card hidden">
            <h2>Quiz Completed!</h2>
            <p class="score-text">Your Score: <span id="final-score">0</span> / <span id="total-questions">0</span></p>
            <h3>High Scores (Saved in LocalStorage)</h3>
            <ul id="high-scores-list"></ul>
            <div class="result-actions">
                <button id="restart-btn">Try Again</button>
                <button id="result-logout-btn" class="btn-secondary">Logout</button>
            </div>
        </div>
    </div>

    <script src="index3.js"></script>
</body>
</html>
